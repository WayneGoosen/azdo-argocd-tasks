# Publish an existing release to the Visual Studio Marketplace.
#
# Deliberately manual and deliberately separate from main.yml: the Marketplace rejects
# re-uploading a version that already exists, so publishing is a one-way door per version.
#
# NOTE ON CREDENTIALS: this uses a publisher PAT. Microsoft decommissions all global PATs on
# 1 December 2026. The replacement is workload identity federation, which is confirmed
# working in azure-devops-extension-tasks@5 (connectTo: AzureRM acquires an Entra token for
# resource 499b84ac-1321-427f-aa17-267ca6975798 internally). See .github/RELEASING.md.
name: Publish to Marketplace

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish, e.g. v0.1.0'
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: marketplace
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: npm

      # tfx from the lockfile (tfx-cli@^0.24.2, first line that recognises Node24).
      # --ignore-scripts: this job only needs the tfx binary (Sonar S6505).
      # Avoids `npm i -g` (zizmor adhoc-packages) and `npx` (Sonar S6505/S8543).
      - run: npm ci --ignore-scripts

      - name: Download the VSIX from the release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: gh release download "$RELEASE_TAG" --pattern '*.vsix' --dir dist

      - name: Publish
        env:
          TFX_TOKEN: ${{ secrets.ADO_PUBLISHER_PAT }}
        run: |
          set -euo pipefail
          VSIX=$(ls dist/*.vsix)
          ./node_modules/.bin/tfx extension publish --vsix "$VSIX" --token "$TFX_TOKEN" --no-color
