name: Close stale issues

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93 # v11.0.0
        with:
          days-before-issue-stale: 30
          days-before-issue-close: 14
          days-before-pr-stale: -1
          days-before-pr-close: -1
          stale-issue-label: 'stale'
          exempt-issue-labels: 'security,bug,pinned'
          exempt-all-milestones: true
          remove-stale-when-updated: true
          stale-issue-message: >
            Thank you for opening this issue! We appreciate you taking the time to report this.
            

            However, we've noticed there hasn't been any activity on this issue for the past 30 days.
            If this issue is still relevant to you, please leave a comment to let us know.
            Your comment will keep this issue open.
            

            If there's no further activity, this issue will be automatically closed in 14 days.
          close-issue-message: >
            This issue has been automatically closed due to inactivity.
            If you believe this is still relevant, feel free to reopen it or file a new issue.
            We're always happy to revisit closed issues!
