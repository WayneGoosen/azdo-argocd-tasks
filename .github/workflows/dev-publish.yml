# Publish a private dev build and share it with a test organisation.
#
# WARNING: the dev extension reuses the production task GUID. Install it in an organisation
# that does NOT have the public extension installed, or the two task registrations collide
# and pipelines resolve the wrong one.
#
# The service endpoint type name IS made unique, by scripts/dev-overrides.mjs -- that one is
# a Marketplace-global namespace, and a dev build holding it blocks the production publish
# outright. See the comment at the top of that script.
name: Dev publish

on:
  workflow_dispatch:
    inputs:
      share_with:
        description: 'Azure DevOps organisation to share the dev build with'
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: marketplace
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm test

      - name: Build dev overrides
        env:
          TFX_TOKEN: ${{ secrets.ADO_PUBLISHER_PAT }}
        run: |
          set -euo pipefail
          # The Marketplace refuses any version it has already seen, and github.run_number
          # is not a safe source: it starts at 1, so the first dev publish collides with
          # anything uploaded by hand, and it never catches up afterwards.
          #
          # Ask the Marketplace what is actually published and increment that instead.
          # Also used by the publish step below.
          npm i -g tfx-cli@^0.24.2 >/dev/null 2>&1
          PUBLISHED=$(tfx extension show \
            --publisher "$(jq -r .publisher vss-extension.json)" \
            --extension-id "$(jq -r .id vss-extension.dev.json)" \
            --token "$TFX_TOKEN" --json --no-color 2>/dev/null \
            | jq -r '.versions[0].version // empty' || true)

          if [ -z "$PUBLISHED" ]; then
            NEXT="0.0.1"
            echo "Nothing published yet; starting at $NEXT"
          else
            NEXT=$(echo "$PUBLISHED" | awk -F. '{printf "%d.%d.%d", $1, $2, $3 + 1}')
            echo "Published $PUBLISHED; publishing $NEXT"
          fi

          echo "DEV_VERSION=$NEXT" >> "$GITHUB_ENV"

      - run: node scripts/build.mjs

      - name: Rewrite the manifest and task inputs for dev
        # Must run AFTER the build: it patches dist/tasks/*/task.json in place.
        run: |
          set -euo pipefail
          node scripts/dev-overrides.mjs "$DEV_VERSION"
          cat vss-extension.dev.effective.json

      - name: Publish and share
        env:
          TFX_TOKEN: ${{ secrets.ADO_PUBLISHER_PAT }}
        run: |
          set -euo pipefail
          tfx extension publish \
            --manifest-globs vss-extension.json \
            --overrides-file vss-extension.dev.effective.json \
            --share-with "${{ inputs.share_with }}" \
            --token "$TFX_TOKEN" \
            --no-color
