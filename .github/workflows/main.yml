# Build and cut a GitHub release on every push to main.
#
# This does NOT publish to the Marketplace. Publishing is a separate, deliberate
# workflow_dispatch, because a Marketplace version cannot be replaced once it exists.
name: Main

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'samples/**'
      - '.github/workflows/pr.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - uses: gittools/actions/gitversion/setup@1918cb0db30e20631f273e322d08c48af11db368 # v4.0.1
        with:
          versionSpec: '6.x'

      - id: gitversion
        uses: gittools/actions/gitversion/execute@1918cb0db30e20631f273e322d08c48af11db368 # v4.0.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      - name: Stamp version into the manifest and every task.json
        run: node scripts/stamp-version.mjs "${{ steps.gitversion.outputs.majorMinorPatch }}"

      - run: npm run package

      - name: Verify VSIX marketplace assets
        run: |
          set -euo pipefail
          VSIX=$(ls dist/*.vsix)
          MANIFEST=$(unzip -p "$VSIX" extension.vsixmanifest)
          fail=0
          for asset in Microsoft.VisualStudio.Services.Content.Details \
                       Microsoft.VisualStudio.Services.Icons.Default; do
            grep -q "$asset" <<<"$MANIFEST" || { echo "::error::Missing asset entry $asset"; fail=1; }
          done
          exit $fail

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.gitversion.outputs.majorMinorPatch }}"
          gh release create "v$VERSION" dist/*.vsix --generate-notes --title "v$VERSION"
