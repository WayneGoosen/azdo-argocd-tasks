name: Docs

# Builds the Material for MkDocs site and deploys it to GitHub Pages.
# Source lives in docs/ + mkdocs.yml. Marketplace screenshots are copied in at build
# time (docs/assets/images is generated, not committed) so there's a single source of
# truth for the images.
#
# Note internal working documents live in internal/, which is NOT tracked and never
# reaches the site.

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'marketplace/images/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

# Write stays on the jobs that upload/deploy. Workflow-level write is overly broad
# (zizmor excessive-permissions) and would grant Pages OIDC to the build job.
permissions:
  contents: read

# Allow one concurrent deployment; don't cancel an in-progress one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Install MkDocs Material
        run: pip install -r docs/requirements.txt

      - name: Stage screenshots into the docs tree
        run: |
          set -e
          mkdir -p docs/assets/images
          # No screenshots yet; copy them in once marketplace/images has some.
          cp marketplace/images/*.png docs/assets/images/ 2>/dev/null || \
            echo "No marketplace screenshots to stage yet."

      - name: Build site
        run: mkdocs build --strict

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
