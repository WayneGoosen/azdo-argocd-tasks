# SonarCloud configuration.
#
# Free for public repositories. Requires a SonarCloud project and a SONAR_TOKEN secret --
# see .github/RELEASING.md. The analysis step in pr.yml skips itself when the token is
# absent, so the `build` check stays green for forks and before setup is complete.

sonar.projectKey=WayneGoosen_azdo-argocd-tasks
sonar.organization=waynegoosen
sonar.projectName=Argo CD Pipeline Tasks

sonar.sources=packages,tasks,tab,scripts
sonar.tests=packages,tasks,test,tab
sonar.test.inclusions=**/test/**/*.ts,**/*.test.ts
# Everything under sonar.sources that is really a test, so it is not double-counted.
sonar.exclusions=**/test/**,**/*.test.ts,**/node_modules/**,dist/**,coverage/**,vendor/**

sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.sourceEncoding=UTF-8

# The vendored Argo CD OpenAPI document is upstream's, not ours to fix.
sonar.coverage.exclusions=**/test/**,**/*.test.ts,tab/tab.ts
